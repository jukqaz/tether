<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tether · 한영과 화면 모드 비교</title><style>*{box-sizing:border-box}body{margin:0;padding:28px;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#eef1f6;color:#222b39}header,nav,main,footer{max-width:1320px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:22px;margin:0 0 7px}p{margin:0;color:#596474;line-height:1.6}a{color:#0068d9}nav{display:flex;gap:7px;flex-wrap:wrap;margin-top:20px;margin-bottom:20px}button{padding:8px 12px;border:1px solid #cbd3df;border-radius:8px;background:#fff;color:#323d4d;font:inherit;cursor:pointer}button[aria-pressed=true]{color:#fff;background:#0068d9;border-color:#0068d9}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}figure{margin:0}figcaption{font-weight:600;margin-bottom:9px}img{display:block;width:100%;height:auto;border-radius:10px;border:1px solid #c5cedd}footer{margin-top:22px;font-size:12px;line-height:1.8}footer a{margin-right:16px}@media(max-width:800px){main{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}body{padding:18px}}</style><header><div><h1>Tether · 한글 / 영어 × 밝음 / 어두움</h1><p>같은 화면의 웹 시안 캡처입니다. 이미지를 누르면 원본 크기로 볼 수 있습니다.</p></div><a href="./">조작형 시안 열기 →</a></header><nav aria-label="비교할 화면"></nav><main></main><footer><p>모든 수치·버전·상태는 예시입니다. 실제 앱·전원·잠금·도우미·업데이트를 제어하지 않습니다.</p><a href="./screens-i18n/ko-dark-update-ready.jpg" target="_blank">업데이트 준비 가능 예시</a><a href="./screens-i18n/en-light-update-error.jpg" target="_blank">업데이트 확인 실패 예시</a><a href="./design-comparison.html">이전 / 개선 시안 비교</a></footer><script>const views=[['keep','잠자기 방지'],['power','전원 동작'],['general','앱 설정'],['keep-end','보호 상세 · 스크롤 끝'],['general-end','업데이트 · 스크롤 끝']];const combos=[['ko','light','한글 · 밝은 화면'],['ko','dark','한글 · 어두운 화면'],['en','light','English · Light'],['en','dark','English · Dark']];let current='keep';function render(){document.querySelector('nav').replaceChildren(...views.map(([key,label])=>{const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-pressed',String(key===current));b.onclick=()=>{current=key;render()};return b}));document.querySelector('main').replaceChildren(...combos.map(([locale,theme,label])=>{const f=document.createElement('figure'),c=document.createElement('figcaption'),a=document.createElement('a'),i=document.createElement('img');c.textContent=label;i.src='./screens-i18n/'+locale+'-'+theme+'-'+current+'.jpg';i.alt=label+' '+views.find(v=>v[0]===current)[1];a.href=i.src;a.target='_blank';a.append(i);f.append(c,a);return f}))}render()</script></html>
